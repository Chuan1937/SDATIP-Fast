[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sdatip"
version = "1.0.1"
description = "Fast stochastic determination of arrival time and initial polarity of seismic waveforms"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8"
authors = [
    {name = "He XingChen", email = "chuanjun1978@gmail.com"},
]
keywords = ["seismic", "waveform", "arrival-time", "polarity", "geophysics"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "numpy>=1.20.0",
    "scipy>=1.7.0",
    "numba>=0.55.0",
    "obspy>=1.3.0",
    "matplotlib>=3.5.0",
    "tqdm>=4.60.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.1.0",
]

[project.urls]
Homepage = "https://github.com/Chuan1937/SDATIP-Fast"
Documentation = "https://github.com/Chuan1937/SDATIP-Fast#readme"
Repository = "https://github.com/Chuan1937/SDATIP-Fast"

[tool.setuptools.packages.find]
where = ["."]
include = ["sdatip*"]

[tool.ruff]
line-length = 120
target-version = "py38"
